# App Fly propre à Sindragosa (à créer : fly apps create sindragosa), avec sa propre base.
# Ne jamais remettre arran-dnd : c'est l'app Arran, qui continue de vivre.
app = "sindragosa"
primary_region = "cdg"

[build]

[deploy]
  release_command = "node server/dist/scripts/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  soft_limit = 200
  hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"
