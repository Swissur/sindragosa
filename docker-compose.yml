# Base locale de Sindragosa, distincte de celle d'Arran (projet, port, volume).
name: sindragosa
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sindragosa
      POSTGRES_USER: sindragosa
      POSTGRES_PASSWORD: sindragosa_dev
    ports:
      - "5441:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
