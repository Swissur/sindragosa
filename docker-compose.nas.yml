# Prod sur le NAS (plan 36). Tailscale Funnel (paquet DSM) publie l'app en HTTPS :
# il relaie vers 127.0.0.1:8080, seul port ouvert, et seulement sur la machine elle-même.
name: sindragosa-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sindragosa
      POSTGRES_USER: sindragosa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindragosa -d sindragosa"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: sindragosa:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://sindragosa:${POSTGRES_PASSWORD}@postgres:5432/sindragosa
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL manquant dans .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pg_data:
